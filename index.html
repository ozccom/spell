    this.hideAddModal();
  },

  // ── Shared helpers ──
  _escId(s) { return s.replace(/[^a-zA-Z0-9]/g, '_'); },

  async _fetchMeaning(lower) {
    // Check cache first
    this._loadMeaningCache();
    if (this._meaningCache[lower] !== undefined) return this._meaningCache[lower];
    // Fetch
    for (const url of [
      `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(lower)}`,
      `https://translate.google.cn/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(lower)}`,
      `https://api.mymemory.translated.net/get?q=${encodeURIComponent(lower)}&langpair=en|zh-CN`
    ]) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 6000);
        const resp = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (resp.ok) {
          const data = await resp.json();
          let result;
          if (url.includes('mymemory')) result = data?.responseData?.translatedText || '';
          else result = data && data[0] ? data[0].map(item => item[0]).filter(Boolean).join('；') : '';
          if (result) {
            this._meaningCache[lower] = result;
            this._saveMeaningCache();
            return result;
          }
        }
        if (resp.status === 429) await this.sleep(500);
      } catch(e) {}
    }
    // Cache empty result too to avoid repeated attempts
    this._meaningCache[lower] = '';
    this._saveMeaningCache();
    return '';
  },

  async _fetchPhonetic(lower) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 5000);
      const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(lower)}`, { signal: ctrl.signal });
      clearTimeout(timer);
      if (resp.ok) {
        const data = await resp.json();
        if (data && data[0]) {
          let p = data[0].phonetic || '';
          if (!p && data[0].phonetics) {
            for (const ph of data[0].phonetics) { if (ph.text) { p = ph.text; break; } }
          }
          return p;
        }
      }
    } catch(e) {}
    return '';
  },

  // ── Modal ──
  showNewBookModal() {
    document.getElementById('modalOverlay').style.display = 'flex';
    document.getElementById('newBookName').value = '';
    setTimeout(() => document.getElementById('newBookName').focus(), 100);
  },
  hideModal() {
    document.getElementById('modalOverlay').style.display = 'none';
  },
  createBook() {
    const name = document.getElementById('newBookName').value.trim();
    if (!name) return;
    const id = 'book_' + Date.now();
    this.books.push({ id, name, words: [] });
    this.saveBooks();
    this.currentBookId = id;
    this.renderBooksNav(true);
    this.renderWordCard();
    this.renderWordList();
    this.hideModal();
    this.toast(`已创建 "${name}"`);
  },
  hideAddModal() {
    document.getElementById('addToBookModal').style.display = 'none';
    document.getElementById('addNewBookForm').style.display = 'none';
    document.getElementById('modalFooter').style.display = '';
  },

  renameBook(id) {
    const book = this.books.find(b => b.id === id);
    if (!book) return;
    const tab = document.querySelector(`.book-tab[data-book="${id}"]`);
    if (!tab) return;
    // Replace tab content with inline input
    const nameEl = tab.childNodes[0]; // text node with book name
    const oldName = nameEl ? nameEl.textContent || '' : book.name;
    tab.innerHTML = `<input class="book-rename-input" value="${this.escAttr(oldName)}" style="background:transparent;color:inherit;border:none;font-size:14px;width:80px;outline:none;font-family:var(--font-sans);text-align:center" onblur="App.commitRename('${id}',this.value)" onkeydown="if(event.key==='Enter')App.commitRename('${id}',this.value)">`;
    const inp = tab.querySelector('input');
    if (inp) { inp.focus(); inp.select(); }
  },

  commitRename(id, newName) {
    const name = newName.trim();
    if (!name) { this.renderBooksNav(true); return; }
    const book = this.books.find(b => b.id === id);
    if (book) { book.name = name; this.saveBooks(); }
    this.renderBooksNav(true);
  },

  deleteWordFromBook(idx) {
    const book = this.getCurrentBook();
    if (!book || idx < 0 || idx >= book.words.length) return;
    book.words.splice(idx, 1);
    if (this.currentWordIdx >= book.words.length) this.currentWordIdx = Math.max(0, book.words.length - 1);
    this.saveBooks();
    this.renderBooksNav();
    this.renderWordCard();
    this.renderWordList(document.getElementById('listSearch').value);
  },

  deleteBook(id) {
    const book = this.books.find(b => b.id === id);
    if (!book) return;
    if (confirm(`确定要删除「${book.name}」吗？\n（包含 ${book.words.length} 个单词）`)) {
      this.books = this.books.filter(b => b.id !== id);
      this.saveBooks();
      if (this.currentBookId === id) {
        this.currentBookId = this.books.length > 0 ? this.books[0].id : null;
        this.currentWordIdx = 0;
      }
      this.renderBooksNav(true);
      this.renderWordCard();
      this.renderWordList();
    }
  },

  // ── Settings ──
  applySettings() {
    const s = this.settings;
    document.getElementById('setRate').value = s.rate;
    document.getElementById('rateVal').textContent = s.rate + 'x';
    document.getElementById('setWordGap').value = s.wordGap;
    document.getElementById('wordGapVal').textContent = s.wordGap + 's';
    document.getElementById('setSpellGap').value = s.spellGap;
    document.getElementById('spellGapVal').textContent = s.spellGap + 's';
    document.getElementById('setRepeat').value = s.repeat;
    document.getElementById('repeatVal').textContent = s.repeat + '次';
    document.getElementById('togglePron').className = 'toggle' + (s.togglePron ? ' on' : '');
    document.getElementById('toggleSpell').className = 'toggle' + (s.toggleSpell ? ' on' : '');
    document.getElementById('toggleMeaning').className = 'toggle' + (s.toggleMeaning ? ' on' : '');
  },

  updateRate(val) {
    this.settings.rate = parseFloat(val);
    document.getElementById('rateVal').textContent = val + 'x';
    this.saveSettings();
  },
  updateWordGap(val) {
    this.settings.wordGap = parseFloat(val);
    document.getElementById('wordGapVal').textContent = val + 's';
    this.saveSettings();
  },
  updateSpellGap(val) {
    this.settings.spellGap = parseFloat(val);
    document.getElementById('spellGapVal').textContent = val + 's';
    this.saveSettings();
  },
  updateRepeat(val) {
    this.settings.repeat = parseInt(val);
    document.getElementById('repeatVal').textContent = val + '次';
    this.saveSettings();
  },
  updateVoice(val) {
    this.settings.voiceURI = val;
    this.saveSettings();
    const label = document.getElementById('voiceLabel');
    if (label) {
      if (val) {
        const voices = window.speechSynthesis.getVoices();
        const v = voices.find(v => v.voiceURI === val);
        label.textContent = v ? `${v.name} (${v.lang})` : '默认（自动选择）';
      } else {
        label.textContent = '默认（自动选择）';
      }
    }
  },
  toggleSetting(key) {
    const map = { pron: 'togglePron', spell: 'toggleSpell', meaning: 'toggleMeaning' };
    const sKey = map[key];
    this.settings[sKey] = !this.settings[sKey];
    document.getElementById('toggle' + key.charAt(0).toUpperCase() + key.slice(1)).className =
      'toggle' + (this.settings[sKey] ? ' on' : '');
    this.saveSettings();
  },

  renderVoiceList() {
    const optionsWrap = document.getElementById('voiceOptions');
    const label = document.getElementById('voiceLabel');
    if (!optionsWrap || !label) return;
    const voices = this._cachedVoices || (this._cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
    const goodNames = ['Google','Microsoft','Samantha','Karen','Moira','Fiona','Veena','Alex','Victoria','Tessa','Allison','Ava','Evan','Susan','Tom','Zira','Martha'];
    const filtered = voices.filter(v =>
      v.lang.startsWith('zh') ||
      goodNames.some(n => v.name.includes(n))
    );
    const showSel = !this.settings.voiceURI;
    let html = `<div class="voice-option${showSel?' selected':''}" onclick="App.updateVoice('');App.toggleVoiceList();"><span class="check">${showSel?'✓':''}</span>默认（自动选择）</div>`;
    let selectedLabel = '默认（自动选择）';
    for (const v of filtered) {
      const sel = v.voiceURI === this.settings.voiceURI;
      if (sel) selectedLabel = `${v.name} (${v.lang})`;
      html += `<div class="voice-option${sel?' selected':''}" onclick="App.updateVoice('${this.escAttr(v.voiceURI)}');App.toggleVoiceList();"><span class="check">${sel?'✓':''}</span>${this.escHtml(v.name)} (${v.lang})</div>`;
    }
    optionsWrap.innerHTML = html;
    label.textContent = selectedLabel;
  },

  toggleVoiceList() {
    const wrapper = document.getElementById('voiceDropdown');
    const options = document.getElementById('voiceOptions');
    const isOpen = wrapper.classList.toggle('open');
    if (isOpen) {
      options.style.display = 'block';
      options.classList.add('open');
    } else {
      options.style.display = 'none';
      options.classList.remove('open');
    }
  },

  _autoSelectVoice() {
    if (this.settings.voiceURI) return;
    const voices = this._cachedVoices || window.speechSynthesis.getVoices();
    if (!voices.length) return;
    // Name patterns: iOS + Android + general, in order of preference
    const patterns = [
      'Meijia','meijia','Mei-Jia','Tingting','Ting-Ting','Ting Ting',
      'Xiaoxiao','Xiao Xiao','Google','English','UK','US',
      'zh-CN-female','yue-CH','Hong','Zhang'
    ];
    for (const p of patterns) {
      const v = voices.find(v => v.name.includes(p) || v.voiceURI.includes(p));
      if (v) {
        this.settings.voiceURI = v.voiceURI;
        this.saveSettings();
        this.renderVoiceList();
        return;
      }
    }
    // Fallback: any zh or en voice
    const fallback = voices.find(v => v.lang.startsWith('zh') || v.lang.startsWith('en'));
    if (fallback) {
      this.settings.voiceURI = fallback.voiceURI;
      this.saveSettings();
      this.renderVoiceList();
    }
  },

  resetAll() {
    if (confirm('确定要重置所有数据吗？这将清空所有单词本和设置。')) {
      localStorage.clear();
      this.books = [];
      this.settings = {
        rate: 1.0, wordGap: 1.0, spellGap: 0.5, repeat: 1,
        voiceURI: '', togglePron: true, toggleSpell: true, toggleMeaning: true,
      };
      this.currentBookId = null;
      this.currentWordIdx = 0;
      this.isPlaying = false;
      this.cancelAllSpeech();
      this.applySettings();
      this.init();
      this.toast('已重置所有数据');
    }
  },

  // ── Import / Export ──
  exportData() {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      books: this.books.map(b => ({ id: b.id, name: b.name, words: b.words })),
      settings: this.settings,
      phoneticCache: this._phoneticCache || {},
      meaningCache: this._meaningCache || {}
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `spell-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    this.toast('备份已导出');
  },

  importData(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.books || !Array.isArray(data.books)) throw new Error('无效格式');
        const total = data.books.reduce((s, b) => s + (b.words?.length || 0), 0);
        if (!confirm(`即将导入 ${data.books.length} 个单词本（共 ${total} 词）。\n当前数据将被覆盖，确定继续？`)) return;
        // Restore
        this.books = data.books.map(b => ({ id: b.id, name: b.name, words: b.words || [] }));
        this.saveBooks();
        if (data.settings) {
          this.settings = data.settings;
          this.saveSettings();
          this.applySettings();
        }
        if (data.phoneticCache) {
          this._phoneticCache = data.phoneticCache;
          this._savePhoneticCache();
        }
        if (data.meaningCache) {
          this._meaningCache = data.meaningCache;
          this._saveMeaningCache();
        }
        this.currentBookId = this.books.length > 0 ? this.books[0].id : null;
        this.currentWordIdx = 0;
        this.selectedWords.clear();
        this.invalidateListCache();
        this.renderBooksNav(true);
        this.renderWordCard();
        this.renderWordList();
        this.toast(`已导入 ${data.books.length} 个单词本`);
      } catch(err) {
        this.toast('导入失败：文件格式不正确');
      }
    };
    reader.readAsText(file);
    // Reset file input so same file can be re-imported
    document.getElementById('importFile').value = '';
  },

  // ── Utilities ──
  escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  },
  escAttr(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  },
  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  },
};

// ════════════════════════════════════════
//  INITIALIZATION
// ════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});

// Flush pending debounced saves on page close
window.addEventListener('beforeunload', () => {
  if (App._saveBooksNow) App._saveBooksNow();
});

// iOS PWA: force layout refresh after returning from background
// iOS sometimes leaves 100dvh stale, causing blank space below bottom nav
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  // Layout fix
  setTimeout(() => {
    const b = document.body;
    const h = b.style.height;
    b.style.height = '99.999dvh';
    void b.offsetHeight;
    b.style.height = '';
  }, 50);
  // Audio recovery: iOS may have killed the audio session in background.
  // If playback was supposed to be running, restart it.
  if (App.isPlaying) {
    setTimeout(() => App._restorePlayback(), 300);
  }
});
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    setTimeout(() => { window.scrollTo(0, 0); }, 50);
  }
});

// Load voices when available
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    App._cachedVoices = window.speechSynthesis.getVoices();
    App.renderVoiceList();
    if (!App.settings.voiceURI) App._autoSelectVoice();
  };
}
</script>
